<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#fafbfc" />
  <title>一起喝点</title>
  <script type="module" crossorigin src="./assets/index-Boxxzk2Y.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-AwTO6Ba6.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== 全新UI设计：极简北欧风 ===== */

    /* CSS变量 */
    :root {
      --bg: #fafbfc;
      --bg-card: #ffffff;
      --bg-elevated: #f8f9fa;
      --primary: #3b82f6;
      --primary-light: #60a5fa;
      --primary-dark: #2563eb;
      --accent: #f59e0b;
      --text: #1f2937;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --border: #e5e7eb;
      --border-light: #f3f4f6;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -1px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 25px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.03);
      --shadow-xl: 0 20px 40px -5px rgba(0,0,0,0.1);
      --radius: 16px;
      --radius-sm: 10px;
      --radius-full: 9999px;
    }

    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== 全局重置 ===== */
    html, body {
      background: var(--bg) !important;
      color: var(--text) !important;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
      line-height: 1.5 !important;
    }

    .page-container {
      background: var(--bg) !important;
      padding-bottom: 100px !important;
    }

    /* ===== 导航栏 - 全新设计 ===== */
    .nav-bar {
      padding: 16px 20px 12px !important;
      background: rgba(250, 251, 252, 0.9) !important;
      backdrop-filter: blur(20px) !important;
      border-bottom: 1px solid var(--border-light) !important;
    }
    .nav-bar .nav-title {
      font-size: 20px !important;
      font-weight: 700 !important;
      color: var(--text) !important;
      -webkit-text-fill-color: var(--text) !important;
      background: none !important;
    }
    .nav-bar .nav-actions {
      display: flex !important;
      gap: 8px !important;
    }
    .nav-bar .nav-actions > * {
      width: 36px !important;
      height: 36px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: var(--bg-elevated) !important;
      border-radius: var(--radius-sm) !important;
      color: var(--text-secondary) !important;
      transition: all 0.2s ease !important;
    }
    .nav-bar .nav-actions > *:active {
      transform: scale(0.92) !important;
      background: var(--border) !important;
    }

    /* ===== 搜索栏 - 全新设计 ===== */
    .search-bar {
      margin: 12px 16px !important;
      background: var(--bg-card) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius) !important;
      padding: 12px 16px !important;
      box-shadow: var(--shadow-sm) !important;
      transition: all 0.2s ease !important;
    }
    .search-bar:focus-within {
      border-color: var(--primary) !important;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1) !important;
    }
    .search-bar input {
      font-size: 15px !important;
      color: var(--text) !important;
      background: transparent !important;
    }
    .search-bar input::placeholder {
      color: var(--text-muted) !important;
    }

    /* ===== 地图切换 - 全新设计 ===== */
    .map-toggle-bar {
      padding: 0 16px 12px !important;
    }
    .map-toggle-bar .toggle-switch {
      background: var(--bg-elevated) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-full) !important;
      padding: 4px !important;
    }
    .map-toggle-bar .toggle-btn {
      border-radius: var(--radius-full) !important;
      font-size: 13px !important;
      font-weight: 500 !important;
      color: var(--text-secondary) !important;
      padding: 8px 16px !important;
      transition: all 0.2s ease !important;
    }
    .map-toggle-bar .toggle-btn.active {
      background: var(--bg-card) !important;
      color: var(--text) !important;
      box-shadow: var(--shadow) !important;
    }

    /* ===== 地图容器 - 全新设计 ===== */
    .map-container {
      margin: 0 16px !important;
      border-radius: var(--radius) !important;
      border: 1px solid var(--border) !important;
      box-shadow: var(--shadow-lg) !important;
      overflow: hidden !important;
    }
    .map-bg {
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e0f2fe 100%) !important;
    }
    .map-bg .map-grid {
      stroke: var(--border) !important;
      stroke-width: 1 !important;
    }

    /* ===== 定位点 - 全新设计 ===== */
    .my-loc-dot {
      background: var(--primary) !important;
      border: 3px solid #fff !important;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2), var(--shadow) !important;
      width: 18px !important;
      height: 18px !important;
    }
    .my-loc-pulse {
      background: rgba(59, 130, 246, 0.1) !important;
    }
    .my-loc-label {
      background: var(--bg-card) !important;
      color: var(--text) !important;
      font-size: 11px !important;
      font-weight: 500 !important;
      padding: 4px 10px !important;
      border-radius: var(--radius-full) !important;
      box-shadow: var(--shadow) !important;
      border: none !important;
    }

    /* ===== 筛选标签 - 全新设计 ===== */
    .type-filter-row {
      padding: 12px 16px !important;
    }
    .type-chip {
      background: var(--bg-card) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-full) !important;
      padding: 8px 16px !important;
      font-size: 13px !important;
      font-weight: 500 !important;
      color: var(--text-secondary) !important;
      transition: all 0.2s ease !important;
    }
    .type-chip:active {
      transform: scale(0.95) !important;
    }
    .type-chip.active {
      background: var(--primary) !important;
      border-color: var(--primary) !important;
      color: #fff !important;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3) !important;
    }

    /* ===== 酒吧卡片 - 全新设计 ===== */
    .bar-card {
      margin: 8px 16px !important;
      background: var(--bg-card) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius) !important;
      padding: 16px !important;
      box-shadow: var(--shadow-sm) !important;
      transition: all 0.2s ease !important;
      position: relative !important;
      overflow: hidden !important;
    }
    .bar-card::before {
      content: '' !important;
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      bottom: 0 !important;
      width: 3px !important;
      background: var(--primary) !important;
      opacity: 0 !important;
      transition: opacity 0.2s ease !important;
    }
    .bar-card:active {
      transform: scale(0.98) !important;
      box-shadow: var(--shadow) !important;
    }
    .bar-card:active::before {
      opacity: 1 !important;
    }
    .bar-card .bar-header {
      display: flex !important;
      align-items: flex-start !important;
      justify-content: space-between !important;
      margin-bottom: 10px !important;
    }
    .bar-card .bar-name {
      font-size: 16px !important;
      font-weight: 600 !important;
      color: var(--text) !important;
      margin-bottom: 4px !important;
    }
    .bar-card .bar-type {
      display: inline-flex !important;
      padding: 3px 8px !important;
      background: rgba(59, 130, 246, 0.08) !important;
      color: var(--primary) !important;
      border-radius: var(--radius-full) !important;
      font-size: 11px !important;
      font-weight: 500 !important;
    }
    .bar-card .bar-meta {
      display: flex !important;
      gap: 12px !important;
      font-size: 13px !important;
      color: var(--text-secondary) !important;
    }
    .bar-card .bar-meta span {
      display: flex !important;
      align-items: center !important;
      gap: 4px !important;
    }
    .bar-card .bar-rating {
      color: var(--accent) !important;
      font-weight: 600 !important;
    }
    .bar-card .bar-distance {
      color: var(--text-muted) !important;
    }
    .bar-card .bar-price {
      color: var(--text) !important;
      font-weight: 600 !important;
    }

    /* ===== 酒吧标记 - 全新设计 ===== */
    .bar-marker .marker-pin {
      background: var(--bg-card) !important;
      border-radius: 12px !important;
      padding: 6px !important;
      box-shadow: var(--shadow-lg) !important;
      border: 1px solid var(--border) !important;
    }
    .bar-marker .marker-icon {
      font-size: 20px !important;
    }
    .bar-marker .marker-price {
      background: var(--primary) !important;
      color: #fff !important;
      border: none !important;
      border-radius: var(--radius-full) !important;
      padding: 3px 8px !important;
      font-size: 10px !important;
      font-weight: 600 !important;
      margin-top: 4px !important;
    }

    /* ===== 酒友标记 - 全新设计 ===== */
    .mate-avatar {
      border: 2px solid var(--bg-card) !important;
      box-shadow: var(--shadow) !important;
    }
    .mate-avatar-wrap.male {
      filter: drop-shadow(0 2px 6px rgba(59, 130, 246, 0.3)) !important;
    }
    .mate-avatar-wrap.female {
      filter: drop-shadow(0 2px 6px rgba(244, 63, 94, 0.3)) !important;
    }

    /* ===== 底部导航 - 全新设计 ===== */
    .tab-bar {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      background: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(20px) !important;
      border-top: 1px solid var(--border-light) !important;
      padding: 8px 0 !important;
      padding-bottom: calc(8px + env(safe-area-inset-bottom)) !important;
      z-index: 100 !important;
    }
    .tab-bar .tab-item {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      gap: 4px !important;
      padding: 6px 12px !important;
      color: var(--text-muted) !important;
      font-size: 10px !important;
      font-weight: 500 !important;
      transition: all 0.2s ease !important;
    }
    .tab-bar .tab-item:active {
      transform: scale(0.9) !important;
    }
    .tab-bar .tab-item.active {
      color: var(--primary) !important;
    }
    .tab-bar .tab-item .tab-icon {
      width: 24px !important;
      height: 24px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-size: 20px !important;
    }
    .tab-bar .tab-item.active .tab-icon {
      color: var(--primary) !important;
    }

    /* ===== 浮动按钮 - 全新设计 ===== */
    .fab {
      position: fixed !important;
      bottom: 90px !important;
      right: 20px !important;
      width: 56px !important;
      height: 56px !important;
      background: var(--primary) !important;
      border-radius: 50% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4) !important;
      z-index: 90 !important;
      transition: all 0.2s ease !important;
    }
    .fab:active {
      transform: scale(0.9) !important;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3) !important;
    }

    /* ===== 通用按钮 - 全新设计 ===== */
    .btn-primary, .btn-main {
      background: var(--primary) !important;
      color: #fff !important;
      font-weight: 600 !important;
      border-radius: var(--radius-sm) !important;
      padding: 12px 20px !important;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3) !important;
      transition: all 0.2s ease !important;
    }
    .btn-primary:active, .btn-main:active {
      transform: scale(0.96) !important;
    }
    .btn-secondary {
      background: var(--bg-elevated) !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-sm) !important;
    }

    /* ===== 标签 - 全新设计 ===== */
    .tag {
      display: inline-flex !important;
      padding: 4px 10px !important;
      background: var(--bg-elevated) !important;
      color: var(--text-secondary) !important;
      border-radius: var(--radius-full) !important;
      font-size: 12px !important;
      font-weight: 500 !important;
    }

    /* ===== 通用卡片 - 全新设计 ===== */
    .glass-card, .card {
      background: var(--bg-card) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius) !important;
      box-shadow: var(--shadow) !important;
    }

    /* ===== 文字颜色 ===== */
    .text-primary { color: var(--text) !important; }
    .text-secondary { color: var(--text-secondary) !important; }
    .text-muted { color: var(--text-muted) !important; }

    /* ===== 滚动条 ===== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ===== 动画 ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .bar-card {
      animation: fadeIn 0.3s ease !important;
    }

    /* ===== 全局覆盖暗色元素 ===== */
    [style*="background:#0f1115"], [style*="background: #0f1115"] {
      background: var(--bg-card) !important;
    }
    [style*="background:#1a1d25"], [style*="background: #1a1d25"] {
      background: var(--bg-elevated) !important;
    }
    [style*="color:#889"], [style*="color: #889"] {
      color: var(--text-muted) !important;
    }
    [style*="color:#fff"], [style*="color: #fff"] {
      color: var(--text) !important;
    }
    [style*="color:#d6b36a"], [style*="color: #d6b36a"] {
      color: var(--accent) !important;
    }
    [style*="border-radius:20px"], [style*="border-radius: 20px"] {
      border-radius: var(--radius) !important;
    }
    [style*="border-radius:30px"], [style*="border-radius: 30px"] {
      border-radius: var(--radius-full) !important;
    }
  </style>
</head>
<body>
  <div id="app"></div>
</body>
</html>
